<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopStore</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo"><a href="/">ShopStore</a></h1>
            <nav class="nav">
                <a href="/" class="nav-link">Products</a>
                <a href="/cart" class="nav-link active">
                    Cart
                    <span id="cart-count" class="cart-count">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="main container">
        <h1>Shopping Cart</h1>

        <div id="cart-empty" class="cart-empty" style="display: none;">
            <p>Your cart is empty</p>
            <a href="/" class="btn btn-primary">Continue Shopping</a>
        </div>

        <div id="cart-content" class="cart-content" style="display: none;">
            <div class="cart-items" id="cart-items">
                <!-- Cart items will be loaded here -->
            </div>

            <div class="cart-summary">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span id="shipping">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>
                <a href="/checkout" class="btn btn-primary btn-full" id="checkout-btn">Proceed to Checkout</a>
                <a href="/" class="btn btn-secondary btn-full">Continue Shopping</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 ShopStore. All rights reserved.</p>
        </div>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
