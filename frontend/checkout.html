<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopStore</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo"><a href="/">ShopStore</a></h1>
            <nav class="nav">
                <a href="/" class="nav-link">Products</a>
                <a href="/cart" class="nav-link">
                    Cart
                    <span id="cart-count" class="cart-count">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="main container">
        <h1>Checkout</h1>

        <div id="checkout-empty" class="checkout-empty" style="display: none;">
            <p>Your cart is empty</p>
            <a href="/" class="btn btn-primary">Continue Shopping</a>
        </div>

        <div id="checkout-content" class="checkout-content" style="display: none;">
            <div class="checkout-grid">
                <div class="checkout-form-section">
                    <h2>Shipping Information</h2>
                    <form id="checkout-form" class="checkout-form">
                        <div class="form-group">
                            <label for="email">Email <span class="required">*</span></label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name <span class="required">*</span></label>
                                <input type="text" id="firstName" name="firstName" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name <span class="required">*</span></label>
                                <input type="text" id="lastName" name="lastName" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="address">Address <span class="required">*</span></label>
                            <input type="text" id="address" name="address" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City <span class="required">*</span></label>
                                <input type="text" id="city" name="city" required>
                            </div>
                            <div class="form-group">
                                <label for="state">State <span class="required">*</span></label>
                                <input type="text" id="state" name="state" required>
                            </div>
                            <div class="form-group">
                                <label for="zipCode">ZIP Code <span class="required">*</span></label>
                                <input type="text" id="zipCode" name="zipCode" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="country">Country <span class="required">*</span></label>
                            <input type="text" id="country" name="country" required value="USA">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone <span class="required">*</span></label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                    </form>
                </div>

                <div class="checkout-summary-section">
                    <h2>Order Summary</h2>
                    <div class="checkout-items" id="checkout-items">
                        <!-- Items will be loaded here -->
                    </div>
                    <div class="checkout-summary">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="checkout-subtotal">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span id="checkout-shipping">$0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span id="checkout-total">$0.00</span>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary btn-full" id="place-order-btn">Place Order</button>
                    <a href="/cart" class="btn btn-secondary btn-full">Back to Cart</a>
                </div>
            </div>
        </div>

        <div id="checkout-loading" class="checkout-loading" style="display: none;">
            <div class="spinner"></div>
            <p>Processing your order...</p>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 ShopStore. All rights reserved.</p>
        </div>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
